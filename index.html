<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONGZz DIGITAL - TikTok Boost</title>
    <!-- Font Awesome និង Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Khmer+OS+Battambang:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Khmer OS Battambang', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* ---------------- Countdown Screen Style ---------------- */
        #countdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .countdown-card {
            background: #262626;
            border: 3px solid #ff0055;
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.4);
            animation: rgbGlow 6s linear infinite;
        }

        .countdown-title {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .countdown-timer {
            font-size: 45px;
            font-weight: bold;
            color: #00ffd5;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(0, 255, 213, 0.5);
        }

        .countdown-desc {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 25px;
        }

        .skip-btn {
            background: linear-gradient(145deg, #ff0055, #ff5500);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        .skip-btn:active {
            transform: scale(0.95);
        }

        /* លាក់ Main App ពេលកំពុងរាប់ថយក្រោយ */
        #main-app {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        /* ---------------- Header Rotating RGB Border ---------------- */
        .rgb-border-box {
            position: relative;
            width: 100%;
            max-width: 420px;
            border-radius: 35px;
            padding: 3px;
            overflow: hidden;
            margin-bottom: 25px;
            background: linear-gradient(0deg, #ff0055, #00ffff, #ffcc00, #ff0055);
            background-size: 400%;
            animation: rgbGlow 6s linear infinite;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }

        @keyframes rgbGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            display: flex;
            align-items: center;
            background-color: #262626;
            padding: 15px 20px;
            border-radius: 32px;
            width: 100%;
            box-sizing: border-box;
        }

        .logo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
            border: 2px solid #fff;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
        }

        .brand-name {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 22px;
            display: flex;
            align-items: center;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .verified-badge {
            color: #1d9bf0;
            margin-left: 6px;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .marquee-box {
            background-color: #333333;
            border-radius: 15px;
            padding: 6px 10px;
            margin-top: 8px;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            animation: marquee 10s linear infinite;
            font-size: 15px;
            color: #00ffd5;
            font-weight: bold;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* ---------------- Section Title ---------------- */
        .section-title {
            width: 100%;
            max-width: 420px;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #444;
            padding-bottom: 8px;
            color: #ffcc00;
            font-weight: bold;
        }

        /* ---------------- Grid Menu ---------------- */
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            width: 100%;
            max-width: 420px;
            margin-bottom: auto;
        }

        /* ---------------- 3D Buttons with Rotating RGB Border ---------------- */
        .btn-wrapper {
            position: relative;
            border-radius: 20px;
            padding: 3px;
            background: linear-gradient(90deg, #ff0055, #00ffcc, #ffff00, #ff0055);
            background-size: 300%;
            animation: buttonRgb 4s linear infinite;
            box-shadow: 0 6px 0 #111, 0 8px 12px rgba(0,0,0,0.4);
            transition: transform 0.1s ease;
        }

        @keyframes buttonRgb {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-wrapper:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #111, 0 4px 6px rgba(0,0,0,0.4);
        }

        .menu-btn {
            background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
            color: #000000;
            border: none;
            padding: 16px 10px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            cursor: pointer;
            box-sizing: border-box;
        }

        .menu-btn i {
            font-size: 20px;
            color: #000000;
        }

        /* ---------------- Footer (Bottom) ---------------- */
        .footer {
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #888888;
            text-align: center;
            letter-spacing: 1px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- Countdown Screen (បង្ហាញពេលចូលមកដំបូង 3 នាទី) -->
    <div id="countdown-screen">
        <div class="countdown-card">
            <div class="countdown-title">LONGZz DIGITAL</div>
            <div class="countdown-desc">សូមរង់ចាំបន្តិច Hệ thốngកំពុងរៀបចំ...</div>
            <div class="countdown-timer" id="timer">03:00</div>
            <button class="skip-btn" onclick="startApp()">ចូលទៅកាន់ App ឥឡូវនេះ</button>
        </div>
    </div>

    <!-- Main App Content (លាក់ទុកមុនពេលអស់ម៉ោង ឬចុចរំលង) -->
    <div id="main-app">
        <!-- Header Box with RGB Border -->
        <div class="rgb-border-box">
            <div class="header">
                <img src="https://img.sanishtech.com/u/3a5550b463abd5ca244cabed3fda9cea.png" alt="Logo" class="logo">
                <div class="title-container">
                    <div class="brand-name">
                        LONGZz DIGITAL 
                        <span class="verified-badge" title="Verified"><i class="fa-solid fa-circle-check"></i></span>
                    </div>
                    <div class="marquee-box">
                        <div class="marquee-text">សេវាកម្មប៊ូស Tik Tok ខ្មែរសុទ្ធល្បឿនលឿនត្រឹមតែ 24/h</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Service Section -->
        <div class="section-title">🛒 សេវាកម្មប៊ូស Tik Tok ខ្មែរ<br>១.សូមជ្រើសរើសសេវាកម្ម</div>

        <!-- 3D Menu Buttons with RGB Running Borders -->
        <div class="grid-menu">
            <div class="btn-wrapper">
                <button class="menu-btn"><i class="fa-brands fa-tiktok"></i> LIKES KHMER</button>
            </div>
            <div class="btn-wrapper">
                <button class="menu-btn"><i class="fa-brands fa-tiktok"></i> VIEWS KHMER</button>
            </div>
            <div class="btn-wrapper">
                <button class="menu-btn"><i class="fa-brands fa-tiktok"></i> Likes Bot data</button>
            </div>
            <div class="btn-wrapper">
                <button class="menu-btn"><i class="fa-brands fa-tiktok"></i> Follow KH</button>
            </div>
        </div>

        <!-- Footer placed at the bottom -->
        <div class="footer">
            Official web LONGZz DIGITAL
        </div>
    </div>

    <!-- JavaScript សម្រាប់រាប់ថយក្រោយ 3 នាទី (180 វិនាទី) -->
    <script>
        let timeLeft = 180; // 3 នាទី = 180 វិនាទី
        const timerElement = document.getElementById("timer");
        const countdownScreen = document.getElementById("countdown-screen");
        const mainApp = document.getElementById("main-app");

        function startApp() {
            countdownScreen.style.display = "none";
            mainApp.style.display = "flex";
        }

        const countdownInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            // រៀបចំទម្រង់បង្ហាញ 00:00
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            timerElement.textContent = minutes + ":" + seconds;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                startApp();
            }
            timeLeft--;
        }, 1000);
    </script>

</body>
</html>
