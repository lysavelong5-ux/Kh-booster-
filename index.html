<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LONGZz DIGITAL - TikTok Boost</title>
    <style>
        body {
            background-color: #333333;
            color: #ffffff;
            font-family: 'Khmer OS Battambang', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            align-items: center;
            background-color: #444444;
            padding: 10px 15px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 15px;
        }
        .title-container {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .brand-name {
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .verified-badge {
            color: #1da1f2;
            margin-left: 5px;
            font-size: 14px;
        }
        .marquee-box {
            background-color: #555555;
            border-radius: 15px;
            padding: 5px 10px;
            margin-top: 5px;
            overflow: hidden;
            white-space: nowrap;
            width: 100%;
        }
        .marquee-text {
            display: inline-block;
            animation: marquee 10s linear infinite;
            font-size: 13px;
            color: #dddddd;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .section-title {
            width: 100%;
            max-width: 400px;
            font-size: 15px;
            margin-bottom: 15px;
            border-bottom: 2px solid #555;
            padding-bottom: 5px;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .menu-btn {
            background-color: #e0e0e0;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn:hover {
            background-color: #ffffff;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #aaaaaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img src="https://img.sanishtech.com/u/3a5550b463abd5ca244cabed3fda9cea.png" alt="Logo" class="logo">
        <div class="title-container">
            <div class="brand-name">LONGZz DIGITAL <span class="verified-badge">✔</span></div>
            <div class="marquee-box">
                <div class="marquee-text">សេវាកម្មប៊ូស Tik Tok ខ្មែរសុទ្ធល្បឿនលឿនត្រឹមតែ 24/h</div>
            </div>
        </div>
    </div>

    <!-- Service Section -->
    <div class="section-title">🍕 សេវាកម្មប៊ូស Tik Tok ខ្មែរ<br>១.សូមជ្រើសរើសសេវាកម្ម</div>

    <!-- Menu Buttons -->
    <div class="grid-menu">
        <button class="menu-btn">🎵 LIKES KHMER</button>
        <button class="menu-btn">🎵 VIEWS KHMER</button>
        <button class="menu-btn">🎵 Likes Bot data</button>
        <button class="menu-btn">🎵 Follow KH</button>
    </div>

    <!-- Footer -->
    <div class="footer">
        Official web LONGZz DIGITAL
    </div>

</body>
</html>
